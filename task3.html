<!-- Write code to perform the tasks as asked below.
• Add three buttons.
• Increase button to increase the fonts. It should stop increasing the fonts when the font
size reaches to 200px or stop button is clicked.
• Decrease button to decrease the fonts. It should stop decreasing the fonts when the
font size reaches to 20px or stop button is clicked.
• Stop button to stop increasing or decreasing the fonts.
• Increasing/decreasing interval is of 100 ms.
• (Default font size = 50px) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="p1">Hello Jimit Here</p>
    <button onclick="increase()">Increase</button>
    <button onclick="decrease()">Decrease</button>
    <button onclick="stop()">Stop</button>
    <script>
        let fs = 50;
        document.getElementById("p1").style.fontSize = fs + "px";

        function update(){
            document.getElementById("p1").style.fontSize = fs + "px";
        }
        let inc_interval;
        let dec_interval;
        function increase(){
            clearInterval(dec_interval);
            inc_interval = setInterval(
                ()=>{
                    if(fs>=200){
                        clearInterval(inc_interval);
                    }
                    else{
                        fs++;
                        update();
                    }
                },100
            );
        }
        
        function decrease(){
            clearInterval(inc_interval);
            dec_interval = setInterval(
                ()=>{
                    if(fs<=20){
                        clearInterval(dec_interval);
                    }
                    else{
                        fs--;
                        update();
                    }
                },100
            );
        }

        function stop(){
            clearInterval(inc_interval);
            clearInterval(dec_interval);
            update();
        }

    </script>
</body>
</html>
